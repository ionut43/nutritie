plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.nutriocr'
version = '0.1.0'

android {
  namespace "expo.modules.nutriocr"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // ML Kit, recunoaștere text pe telefon (fără internet), model inclus în aplicație
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
