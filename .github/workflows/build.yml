# Construiește gratuit aplicația pe serverele GitHub: APK pentru Android și IPA nesemnat pentru iPhone (Sideloadly).
# Varianta pentru iPhone din Safari (fără nimic instalat) o face web.yml.
# Pornire: GitHub → Actions → „Construiește aplicația” → Run workflow.
name: Construiește aplicația

# La fiecare Push: aplicația de Android, publicată în Releases (Obtainium o actualizează singură pe telefon).
# IPA-ul pentru iPhone (Sideloadly) doar când pornești de mână, ca să nu consume minutele de Mac.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['src/data/prices_live.json', 'README.md']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # numărul versiunii pentru tot job-ul (și pentru prebuild, și pentru Gradle): +100 trece peste versiunile instalate de mână
      - run: echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - name: Cheia de semnare (pentru actualizări fără pierderea datelor)
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/nutritie.keystore"
            echo "NUTRITIE_KEYSTORE=$RUNNER_TEMP/nutritie.keystore" >> "$GITHUB_ENV"
            echo "NUTRITIE_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Lipsesc secretele ANDROID_KEYSTORE_*; APK-ul se semnează cu cheia de test."
          fi
      - run: npx expo prebuild --platform android --no-install
      # doar pentru telefoanele de azi (arm64): aplicația are ~75 MB în loc de ~200 MB și se construiește de două ori mai repede
      - run: sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' android/gradle.properties
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: android
      - run: cp android/app/build/outputs/apk/release/app-release.apk Nutritie.apk
      - uses: actions/upload-artifact@v4
        with: { name: Nutritie-android, path: Nutritie.apk }

  ios:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100)) npx expo prebuild --platform ios --no-install
      - run: pod install
        working-directory: ios
      - name: Compilează (fără semnătură; Sideloadly o semnează cu Apple ID-ul tău)
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Nutritie.xcworkspace -scheme Nutritie -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 40
      - run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Nutritie.app Payload/
          zip -qry Nutritie.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: Nutritie-iphone, path: Nutritie.ipa }

  release:
    needs: [android, ios]
    # doar APK-uri semnate cu cheia ta ajung în Releases (altfel n-ar merge instalate peste aplicația de acum)
    if: always() && needs.android.result == 'success' && needs.android.outputs.signed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nutriție – build ${{ github.run_number }}
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            Nutritie.apk
            Nutritie.ipa
