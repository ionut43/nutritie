# Construiește gratuit aplicația pe serverele GitHub: APK pentru Android și IPA nesemnat pentru iPhone (Sideloadly).
# Varianta pentru iPhone din Safari (fără nimic instalat) o face web.yml.
# Pornire: GitHub → Actions → „Construiește aplicația” → Run workflow.
name: Construiește aplicația

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm test
      - name: Cheia de semnare (pentru actualizări fără pierderea datelor)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/nutritie.keystore"
            echo "NUTRITIE_KEYSTORE=$RUNNER_TEMP/nutritie.keystore" >> "$GITHUB_ENV"
            echo "NUTRITIE_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          else
            echo "::warning::Lipsesc secretele ANDROID_KEYSTORE_*; APK-ul se semnează cu cheia de test."
          fi
      - run: npx expo prebuild --platform android --no-install
        env: { BUILD_NUMBER: '${{ github.run_number }}' }
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: android
      - run: cp android/app/build/outputs/apk/release/app-release.apk Nutritie.apk
      - uses: actions/upload-artifact@v4
        with: { name: Nutritie-android, path: Nutritie.apk }

  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
        env: { BUILD_NUMBER: '${{ github.run_number }}' }
      - run: pod install
        working-directory: ios
      - name: Compilează (fără semnătură; Sideloadly o semnează cu Apple ID-ul tău)
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Nutritie.xcworkspace -scheme Nutritie -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 40
      - run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Nutritie.app Payload/
          zip -qry Nutritie.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: Nutritie-iphone, path: Nutritie.ipa }

  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nutriție – build ${{ github.run_number }}
          files: |
            Nutritie.apk
            Nutritie.ipa
