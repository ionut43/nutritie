# Aduce prețurile de azi din Monitorul Prețurilor (Consiliul Concurenței) și le pune în aplicație.
# Rulează singur în fiecare luni dimineață; îl poți porni și de mână din Actions.
# Aplicația are și butonul „Prețuri de azi”, care le ia direct pe telefon pentru orașul tău.
name: Prețuri de azi

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsx scripts/dump_data.ts > /tmp/data.json
      - name: Certificatul intermediar al serverului de prețuri
        run: cat /etc/ssl/certs/ca-certificates.crt scripts/prices/sectigo_intermediate.pem > /tmp/ca.pem
      - run: python3 scripts/prices/fetch_prices.py --ing /tmp/data.json --out src/data/prices_live.json --cafile /tmp/ca.pem --cache /tmp/mpcache
      - name: Salvează prețurile noi
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add src/data/prices_live.json
          git diff --cached --quiet || git commit -m "Prețuri de azi din Monitorul Prețurilor"
          git push
